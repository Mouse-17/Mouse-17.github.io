name: Deploy Source Code

on:
  push:
    branches:
      - master

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install SSH Pass
        run: sudo apt-get install sshpass

      - name: Install PHP 8.2 and required extensions
        run: |
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install php8.2 php8.2-cli php8.2-mbstring php8.2-xml php8.2-zip php8.2-curl php8.2-sqlite3 -y
          echo "exec" | sudo tee -a /etc/php/8.2/cli/conf.d/99-custom.ini

      - name: Install Composer
        run: |
          php8.2 -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php8.2 composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php8.2 -r "unlink('composer-setup.php');"

      - name: Run Composer with PHP 8.2 in backend folder
        run: |
          cd backend
          php8.2 /usr/local/bin/composer install --ignore-platform-reqs

      - name: Create SQLite database file
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Create .env file
        run: echo "${{ secrets.ENV_PROD }}" >> backend/.env

      - name: Zip Backend Source Code
        run: |
          cd backend
          zip -r ../backend.zip . -x "vendor/*"

      - name: Zip Vendor Directory
        run: |
          cd backend
          zip -r ../vendor.zip vendor

      - name: Deploy Backend via SSH
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -P ${{ secrets.SSH_PORT }} backend.zip ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/www/wwwroot/keysport-api.sitilink.vn
          sshpass -e scp -o StrictHostKeyChecking=no -P ${{ secrets.SSH_PORT }} vendor.zip ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/www/wwwroot/keysport-api.sitilink.vn
          sshpass -e ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "unzip -o /www/wwwroot/keysport-api.sitilink.vn/backend.zip -d /www/wwwroot/keysport-api.sitilink.vn/ && rm /www/wwwroot/keysport-api.sitilink.vn/backend.zip"
          sshpass -e ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "unzip -o /www/wwwroot/keysport-api.sitilink.vn/vendor.zip -d /www/wwwroot/keysport-api.sitilink.vn/ && rm /www/wwwroot/keysport-api.sitilink.vn/vendor.zip"

      - name: Set permissions for storage and bootstrap/cache
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /www/wwwroot/keysport-api.sitilink.vn && chown -R www:www storage bootstrap/cache && chmod -R 775 storage bootstrap/cache"

      - name: Run php artisan storage:link
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /www/wwwroot/keysport-api.sitilink.vn && /www/server/php/82/bin/php artisan storage:link || { echo 'SSH command failed'; exit 1; }"

  deploy_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install npm dependencies and build Vue app
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy Frontend to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist